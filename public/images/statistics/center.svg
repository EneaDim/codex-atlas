<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Statistics</title>
  <desc id="desc">Abstract probability and statistics illustration with data bars, a curve, dice and connected points.</desc>
  <defs>
    <radialGradient id="orb" cx="50%" cy="38%" r="66%">
      <stop offset="0" stop-color="#26364a"/>
      <stop offset=".55" stop-color="#141d29"/>
      <stop offset="1" stop-color="#0b1017"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".5" stop-color="#4b9be8"/>
      <stop offset="1" stop-color="#28b7c7"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="8"/>
      <feColorMatrix values="0 0 0 0 0.02 0 0 0 0 0.05 0 0 0 0 0.09 0 0 0 .55 0"/>
      <feBlend in="SourceGraphic"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="190" fill="url(#orb)" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="256" cy="256" r="164" fill="none" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
    <circle cx="256" cy="256" r="128" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
  </g>

  <g opacity=".9">
    <path d="M112 328 C150 322 162 276 197 283 C232 290 235 211 274 217 C311 223 319 166 361 178 C386 185 394 159 409 144"
          fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
    <g fill="#d8e9ff">
      <circle cx="112" cy="328" r="7"/><circle cx="197" cy="283" r="7"/><circle cx="274" cy="217" r="7"/><circle cx="361" cy="178" r="7"/><circle cx="409" cy="144" r="7"/>
    </g>
  </g>

  <g transform="translate(137 167)">
    <rect x="0" y="84" width="28" height="72" rx="8" fill="#8b5cf6" opacity=".92"/>
    <rect x="42" y="54" width="28" height="102" rx="8" fill="#6d7eea" opacity=".94"/>
    <rect x="84" y="20" width="28" height="136" rx="8" fill="#4b9be8" opacity=".96"/>
    <rect x="126" y="69" width="28" height="87" rx="8" fill="#28b7c7" opacity=".94"/>
    <path d="M-8 160 H170" stroke="#fff" stroke-opacity=".24" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g transform="translate(298 286) rotate(-8)" filter="url(#shadow)">
    <rect x="0" y="0" width="104" height="104" rx="24" fill="#f7f9fc" fill-opacity=".94" stroke="#ffffff" stroke-opacity=".5"/>
    <g fill="#1a2432">
      <circle cx="28" cy="28" r="8"/><circle cx="76" cy="28" r="8"/><circle cx="52" cy="52" r="8"/><circle cx="28" cy="76" r="8"/><circle cx="76" cy="76" r="8"/>
    </g>
  </g>

  <g stroke="#7fd3ff" stroke-opacity=".42" stroke-width="2">
    <path d="M111 126 L153 112 L177 137"/><path d="M401 341 L434 365 L405 393"/><path d="M93 384 L126 406 L153 389"/>
  </g>
  <g fill="#9ee2ff" filter="url(#glow)">
    <circle cx="111" cy="126" r="6"/><circle cx="153" cy="112" r="6"/><circle cx="177" cy="137" r="6"/>
    <circle cx="401" cy="341" r="6"/><circle cx="434" cy="365" r="6"/><circle cx="405" cy="393" r="6"/>
    <circle cx="93" cy="384" r="6"/><circle cx="126" cy="406" r="6"/><circle cx="153" cy="389" r="6"/>
  </g>
</svg>
